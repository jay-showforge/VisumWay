[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visumway"
version = "0.2.8"
description = "Shared desktop tools for agents to verify their work, with optional event-triggered wakes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BUSL-1.1" }
dependencies = []

[project.scripts]
visumway = "visumway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
