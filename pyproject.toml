[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visumway"
version = "0.2.7"
description = "Give your AI a body. Keep its brain on demand. Agent-driven computer integration with zero idle inference."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BUSL-1.1" }
dependencies = []

[project.scripts]
visumway = "visumway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
